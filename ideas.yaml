# Eval ideas, built or not. The site lists these on its Ideas page; "eval" links to a built eval.
- title: Gold, 100,000 coins across four accounts
  status: built
  eval: gold
  why: Several accounts in one world. Only a scripted baseline has run; the interesting runs are programs that coordinate accounts.
- title: Most quest points in 30 minutes
  status: built
  eval: quest_points
  why: Open-ended and long, with partial credit. The agent picks the quests, their order and route, and when to give up on one.
- title: Demon Slayer
  status: idea
  why: Several stages, then a fight against Delrith (level 27) at combat level 3. The first eval where the account can die.
- title: Same eval, wall-clock budget instead of game ticks
  status: idea
  why: The world runs in real time, so model latency already costs ticks. A wall-clock bound at a slower tick rate would separate thinking speed from game speed.
- title: Dragon Slayer
  status: built
  eval: dragon_slayer
  why: A long quest with combat, travel and an item hunt, from a new character. The score is the quest varp.
- title: Highest total level in 30 minutes
  status: built
  eval: total_level
  why: Open-ended training with partial credit in every skill. The agent picks which skills to train and how.
- title: Most different items in an hour
  status: built
  eval: collection
  why: Breadth over depth. Every item counts once, noted or not, wherever the account holds it.
- title: Team wealth, four accounts for an hour
  status: built
  eval: team_wealth
  why: Four accounts in one world, scored by the store value of everything they hold. How they split the work is up to the agent.
- title: Swarm, many accounts with one goal
  status: idea
  why: Tens of accounts and a shared target such as total coins. The program decides how accounts talk; the harness only counts.
- title: Skill to a level, cheapest
  status: idea
  why: For example Woodcutting 30. Easy for every model; ranks agents by cost and ticks.
