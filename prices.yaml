# Model list prices, $ per million tokens, in Inspect's --model-cost-config format. Runs record the
# tokens; cost is tokens x these prices, whatever account actually paid. Keys are --model names.
anthropic/claude-haiku-5-5:
  input: 0.10
  output: 0.50
  input_cache_write: 0.125
  input_cache_read: 0.01
openai/openai-codex/gpt-5.6-luna:
  input: 0.20
  output: 1.20
  input_cache_write: 0.25
  input_cache_read: 0.02
anthropic/claude-sonnet-5-5:
  input: 2.00
  output: 10.00
  input_cache_write: 2.50
  input_cache_read: 0.10
