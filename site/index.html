<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#efeee5" />
    <link rel="icon" type="image/png" href="/assets/items/995-10000.png" />
    <title>2004scape evals</title>
    <script>
      // Initialize theme before React mounts to prevent FOUC: a shared link's ?theme=, else the
      // stored choice, else the system's.
      (function () {
        var themeColors = { light: '#efeee5', dark: '#0f0f0e', star: '#000a1a' };
        var linked = new URLSearchParams(window.location.search).get('theme');
        var theme = themeColors[linked] ? linked : localStorage.getItem('theme');
        var resolved = 'light';

        if (theme === 'dark' || theme === 'star') {
          resolved = theme;
        } else if (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          resolved = 'dark';
        }
        if (resolved !== 'light') document.documentElement.classList.add(resolved);

        // Set theme-color meta tag to match resolved theme
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', themeColors[resolved]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
